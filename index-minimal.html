<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scott Lewis - Career Timeline</title>
    <link rel='stylesheet' href='https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css'>
    <link rel="stylesheet" href="./style-minimal.css">
</head>
<body>

<header class="example-header" id="page-header">
    <!-- Header will be loaded from JSON -->
</header>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-12 example-title" id="page-intro">
            <!-- Intro will be loaded from JSON -->
        </div>
    </div>

    <!-- Filter Controls -->
    <div class="row">
        <div class="col-xs-10 col-xs-offset-1 col-sm-8 col-sm-offset-2">
            <div class="filter-controls">
                <button onclick="toggleFilter('date')" class="filter-btn active" id="filter-date" data-type="date">
                    Jobs & Experience
                </button>
                <button onclick="toggleFilter('narrative')" class="filter-btn active" id="filter-narrative" data-type="narrative">
                    Story & Reflections
                </button>
                <button onclick="toggleFilter('factoid')" class="filter-btn active" id="filter-factoid" data-type="factoid">
                    Personal Projects
                </button>
            </div>
        </div>
    </div>

    <!-- Timeline -->
    <div class="row">
        <div class="col-xs-10 col-xs-offset-1 col-sm-8 col-sm-offset-2">
            <ul class="timeline timeline-centered" id="timeline-container">
                <!-- Timeline items will be loaded from JSON -->
            </ul>
        </div>
    </div>
</div>

<footer class="timeline-footer">
    <p>Built with Bootstrap • Simple Timeline Template</p>
    <p>© 2024 Scott Lewis. All rights reserved.</p>
</footer>

<script>
    // Filter toggle functionality
    const activeFilters = new Set(['date', 'narrative', 'factoid']);

    function toggleFilter(type) {
        const button = document.getElementById(`filter-${type}`);

        if (activeFilters.has(type)) {
            activeFilters.delete(type);
            button.classList.remove('active');
        } else {
            activeFilters.add(type);
            button.classList.add('active');
        }

        updateVisibleItems();
    }

    function updateVisibleItems() {
        const allItems = document.querySelectorAll('.timeline-item[data-type]');

        allItems.forEach(item => {
            const itemType = item.getAttribute('data-type');

            if (activeFilters.has(itemType)) {
                item.style.display = '';
            } else {
                item.style.display = 'none';
            }
        });
    }

    // Render timeline item based on type
    function renderTimelineItem(item) {
        if (item.type === 'period') {
            return `
                <li class="timeline-item period">
                    <div class="timeline-info"></div>
                    <div class="timeline-marker"></div>
                    <div class="timeline-content">
                        <h2 class="timeline-title">${item.title}</h2>
                    </div>
                </li>
            `;
        }

        if (item.type === 'date') {
            const bulletsHtml = item.bullets ? `<ul>${item.bullets.map(b => `<li>${b}</li>`).join('')}</ul>` : '';
            const jobTitleHtml = item.jobTitle ? `<p class="job-title">${item.jobTitle}</p>` : '';
            const lessonHtml = item.lesson ? `<p class="lesson">${item.lesson}</p>` : '';

            return `
                <li class="timeline-item" data-type="${item.type}">
                    <div class="timeline-info">
                        <span>${item.info}</span>
                    </div>
                    <div class="timeline-marker marker-date"></div>
                    <div class="timeline-content">
                        <h3 class="timeline-title">${item.title}</h3>
                        ${jobTitleHtml}
                        ${bulletsHtml}
                        ${lessonHtml}
                    </div>
                </li>
            `;
        }

        // narrative or factoid
        const markerClass = item.type === 'factoid' ? 'marker-factoid' : '';
        return `
            <li class="timeline-item" data-type="${item.type}">
                <div class="timeline-info">
                    <span>${item.info}</span>
                </div>
                <div class="timeline-marker ${markerClass}"></div>
                <div class="timeline-content">
                    <h3 class="timeline-title">${item.title}</h3>
                    ${item.content}
                </div>
            </li>
        `;
    }

    // Load and render timeline data
    async function loadTimeline() {
        try {
            const response = await fetch('timeline-data.json');
            const data = await response.json();

            // Render header
            const headerLinks = data.header.links.map(link =>
                `<a href="${link.url}" target="_blank">${link.text}</a>`
            ).join(' <span>|</span> ');

            document.getElementById('page-header').innerHTML = `
                <h1>${data.header.name}</h1>
                <p>${data.header.subtitle}</p>
                <div class="header-links">
                    ${headerLinks}
                </div>
            `;

            // Render intro
            document.getElementById('page-intro').innerHTML = `
                <h2>${data.intro.title}</h2>
                <p>${data.intro.description}</p>
            `;

            // Render timeline
            const timelineHtml = data.timeline.map(item => renderTimelineItem(item)).join('');
            document.getElementById('timeline-container').innerHTML = timelineHtml;

        } catch (error) {
            console.error('Error loading timeline data:', error);
            document.getElementById('timeline-container').innerHTML = `
                <li class="timeline-item">
                    <div class="timeline-content">
                        <p style="color: #FF6B6B;">Error loading timeline data. Please make sure timeline-data.json is in the same directory.</p>
                    </div>
                </li>
            `;
        }
    }

    // Load timeline when page loads
    document.addEventListener('DOMContentLoaded', loadTimeline);
</script>

</body>
</html>
